[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoxview"
version = "0.1.0"
description = "Scale-adaptive environmental exposure modeling: EEI, MAUP diagnostics and spatial cross-validation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdulla Al Kafy", email = "abdullaalkafy@utexas.edu" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7"]
keywords = ["geoai", "environmental exposure", "MAUP", "urban heat", "remote sensing", "Texas"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "pyogrio>=0.7"]
dev = ["pytest>=8", "ruff>=0.5", "nbformat", "nbconvert", "ipykernel"]

[project.urls]
Homepage = "https://abdullakafy.github.io/GeoXVIEW/"
Repository = "https://github.com/AbdullaKafy/GeoXVIEW"
Archive = "https://doi.org/10.26153/tsw/64936"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
